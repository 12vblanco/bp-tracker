<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Aneroid gauge. Scale arc open at the bottom, high zone in the last 40 degrees,
       needle swung into the upper range. Presentation attributes carry a mid-tone
       that reads on either tab colour; the media queries refine per theme for the
       browsers that honour them inside an SVG favicon. -->
  <style>
    @media (prefers-color-scheme: light) {
      .scale { stroke: #669ee4 }
      .high { stroke: #d33a3c }
      .needle { stroke: #17559b }
      .hub { fill: #17559b }
    }
    @media (prefers-color-scheme: dark) {
      .scale { stroke: #4a7fc0 }
      .high { stroke: #f05653 }
      .needle { stroke: #58a4ef }
      .hub { fill: #58a4ef }
    }
  </style>
  <g fill="none" stroke-width="3.2" stroke-linecap="round">
    <path class="scale" stroke="#5c9ad9" d="M6.031 23.849A11 11 0 1 1 26.625 16.353" />
    <path class="high" stroke="#dc4540" d="M26.625 16.353A11 11 0 0 1 25.969 23.849" />
    <path class="needle" stroke="#2b7fd4" d="M16 19.2 21.193 10.889" />
  </g>
  <circle class="hub" cx="16" cy="19.2" r="2.9" fill="#2b7fd4" />
</svg>
